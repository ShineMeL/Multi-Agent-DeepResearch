services:
  api:
    build: .
    command: uv run uvicorn apps.api.main:create_app --factory --host 0.0.0.0 --port 8000 --no-proxy-headers
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a URI-encoded postgresql+asyncpg URL}
      ARTIFACT_ROOT: /var/lib/deepresearch/artifacts
      CHECKPOINT_SQLITE_PATH: /var/lib/deepresearch/artifacts/checkpoints.sqlite
      LANGGRAPH_STRICT_MSGPACK: "true"
      DEPLOYMENT_ACCESS_PROFILE: showcase
      ALLOWED_EXECUTION_MODES: '["replay"]'
      ALLOWED_PROVIDER_PROFILE_IDS: '["replay-default"]'
      ALLOWED_RUN_PURPOSES: '["demo", "test"]'
      ALLOWED_BUDGET_PRESETS: '["low", "medium"]'
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?SESSION_SIGNING_KEY must be set to a 32-byte-or-longer value}
      COOKIE_SECURE: "false"
      TRUSTED_PROXY_CIDRS: '[]'
    volumes:
      - artifact-data:/var/lib/deepresearch/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ui:
    build: .
    command: uv run streamlit run apps/ui/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DEEPRESEARCH_API_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health').read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16
    # The named image account remains stable across image UID changes and lets
    # the official entrypoint initialize PGDATA without an arbitrary numeric UID.
    user: postgres
    environment:
      POSTGRES_DB: deepresearch
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  artifact-data:
  postgres-data:
