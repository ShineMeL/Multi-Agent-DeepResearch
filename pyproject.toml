[project]
name = "multi-agent-deepresearch"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "httpx>=0.28,<0.29",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "pyyaml>=6.0,<7",
  "rank-bm25>=0.2,<1",
  "rich>=14,<15",
  "sentence-transformers>=6,<7",
  "scipy>=1.14,<2",
  "trafilatura>=2.2,<3",
  "typer>=0.27,<1",
  "fastapi>=0.141.1",
  "sse-starlette>=3.4.11",
  "streamlit>=1.63.0",
  "sqlalchemy[asyncio]>=2.0.52",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "uvicorn>=0.52.4",
  "langgraph-checkpoint-postgres>=3.1.2,<3.2",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pyyaml>=6.0.3",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<1",
]

[project.scripts]
deepresearch = "apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "apps", "benchmarks", "experiments", "tests"]
